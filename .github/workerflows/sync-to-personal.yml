name: Sync to Personal Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source Repo
        uses: actions/checkout@v4

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: gnemek20/Hyunwoo_AI_Copy
          token: ${{ secrets.PERSONAL_REPO }}
          path: personal

      - name: Copy source to personal
        run: |
          rsync -av --delete --exclude='.github' --exclude='personal' ./ personal/

      - name: Configure git
        run: |
          git config --global user.name "gnemek20"
          git config --global user.email "gnemek20@gmail.com"

      - name: Push to Target Repo
        run: |
          cd personal
          git add .
          git remote -v